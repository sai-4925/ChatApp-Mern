version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: chatapp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - chatapp-network

  backend:
    build:
      context: ./backend
    container_name: chatapp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/chatapp
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - chatapp-network

  frontend:
    build:
      context: ./frontend
    container_name: chatapp-frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - chatapp-network

volumes:
  mongo-data:

networks:
  chatapp-network:
    driver: bridge
