name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Trigger Render Deploy (Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Trigger Vercel Deploy (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"

# NOTE:
# - RENDER_DEPLOY_HOOK_URL comes from Render dashboard > Service > Settings > Deploy Hook
# - VERCEL_TOKEN / ORG_ID / PROJECT_ID come from Vercel account + project settings
# Add these as repository secrets under Settings > Secrets and variables > Actions
